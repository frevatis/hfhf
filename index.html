    <script>
  let one = document.querySelector('#one');
let two = document.querySelector('#two');
let three = document.querySelector('#three');
let four = document.querySelector('#four');

let butt = document.querySelector('#butt');
let nonbutt = document.querySelector('#nonbutt');
let img = document.querySelector('.mont img');

let images = [
    'style/images/re1.png',
    'style/images/re2.png',
    'style/images/re3.png',
    'style/images/re4.png'
];
let current = 0;
const total = images.length;

function updateDots() {
    let dots = [one, two, three, four];
    dots.forEach((dot, i) => {
        dot.style.width = '10px';
        dot.style.height = '10px';
        dot.style.backgroundColor = 'rgb(63, 63, 63)';
    });
    dots[current].style.width = '15px';
    dots[current].style.height = '15px';
    dots[current].style.backgroundColor = 'red';
}

function updateButtons() {
    // Левая стрелка
    if (current === 0) {
        nonbutt.style.opacity = '0.3';
        nonbutt.style.pointerEvents = 'none';
        nonbutt.style.backgroundColor = 'rgba(0,0,0,0.24)';
       
    } else {
        nonbutt.style.opacity = '1';
        nonbutt.style.pointerEvents = 'auto';
        nonbutt.style.backgroundColor = 'black';
         nonbutt.style.color = 'white'
    }
    
    // Правая стрелка
    if (current === total - 1) {
        butt.style.opacity = '0.3';
        butt.style.pointerEvents = 'none';
        butt.style.backgroundColor = 'rgba(0,0,0,0.24)';
    } else {
        butt.style.opacity = '1';
        butt.style.pointerEvents = 'auto';
        butt.style.backgroundColor = 'black';
    }
}

function changeImage(index) {
    img.style.opacity = '0';
    setTimeout(() => {
        img.src = images[index];
        img.style.opacity = '1';
    }, 200);
}

butt.onclick = () => {
    if (current < total - 1) {
        current++;
        changeImage(current);
        updateDots();
        updateButtons();
    }
};

nonbutt.onclick = () => {
    if (current > 0) {
        current--;
        changeImage(current);
        updateDots();
        updateButtons();
    }
};

updateDots();
updateButtons();

    }
    else{
         btn.innerHTML = '🌙 Темная тема'
    }

}
